services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: white-gold-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:./db.sql
    volumes:
      - ./db.sql:/app/db.sql
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
